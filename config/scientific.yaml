# Complete HGIG model: EAPM followed by RCBR.
dataset: scientific
seed: 2020
reproducibility: true
run_name: hgig
output_root: .

# User-provided interaction splits, fixed SIDs, and item representations.
data_path: ./data
map_path: .emb_map.json
semantic_emb_path: scientific_emb_256.npy
sid_path: ./data/scientific/scientific.sid.json

# Generic SID contract. Only the first three positions are semantic here; the
# final position resolves collisions and is never treated as semantic.
semantic_depth: 3
code_length: 4
code_num: 256
token_roles: [semantic, semantic, semantic, instance]
num_emb_list: [256, 256, 256]

# Sequence-to-SID training.
epochs: 100
learning_rate: 0.0005
weight_decay: 0.05
lr_scheduler_type: cosine
warmup_steps: 0
gradient_accumulation_steps: 1
batch_size: 512
eval_batch_size: 128
num_workers: 4
eval_num_workers: 2
policy_num_workers: 2
persistent_workers: true
prefetch_factor: 2
cpu_threads: 4
max_his_len: 50
progress_mininterval_seconds: 5.0
progress_loss_every_batches: 10
early_stop: 10
eval_step: 1
train_data_ratio: 1.0
valid_data_ratio: 1.0
test_data_ratio: 1.0
policy_data_ratio: 0.10
max_batches_per_epoch: null

# High-rate recommender warmup followed by lower-rate supervised training.
primary_ce_mode: full_vocabulary
sid_embedding_initialization: gaussian
warmstart_path: null
recommender_pretraining:
  epochs: 50
  learning_rate: 0.005
  warmup_steps: 8000
  scheduler_horizon_epochs: 100
  early_stop: 15
stage1_consistency:
  enabled: false
  weight: 0.0
  temperature: 1.0

# Full-vocabulary beam scoring, including invalid SID ranks.
decoding_protocol: full_vocabulary
metrics: recall@1,recall@5,ndcg@5,recall@10,ndcg@10
valid_metric: ndcg@10
num_beams: 20

# Lightweight T5-style encoder-decoder.
max_length: 210
encoder_layers: 6
decoder_layers: 6
d_model: 128
d_ff: 512
num_heads: 4
d_kv: 64
dropout_rate: 0.1
activation_function: relu
feed_forward_proj: relu

modules:
  module_1:
    name: EAPM
    strength: 1.0
    size_penalty: 0.0
    min_gate: 0.0
    max_gate: 0.25
    gate_bias: -2.0
    # Bounded learned cosine scale avoids an almost uniform semantic expert.
    logit_scale_init: 8.0
    logit_scale_max: 32.0
    gate_loss_weight: 0.02
    gate_target_temperature: 1.0
    memory_rank: 16
    support_shrinkage: 64.0
    route_loss_weight: 0.05
    memory_l2_weight: 0.0001
    base_anchor_fraction: 0.25
    fusion_warmup_epochs: 2
    fusion_ramp_epochs: 5
  module_2:
    name: RCBR
    # Select the best RCBR epoch by validation; the Stage-1 checkpoint is
    # logged as a reference, not selected as the final model.
    epochs: 2
    batch_size: 32
    learning_rate: 0.00002
    updates_per_batch: 1
    hard_negatives: 3
    preference_beta: 0.2
    sequence_weight: 0.10
    router_guard_weight: 0.05
    prefix_weight: 0.15
    prefix_margin: 0.5
    nll_weight: 1.0
    max_batches_per_epoch: null

telemetry:
  sample_limit: 4096
  samples_per_batch: 8
  # Sparse sampling preserves mechanism evidence without synchronizing the GPU
  # on every training batch. Samples are accumulated across epochs.
  capture_every_batches: 20
  embedding_dimensions: 256
  final_diagnostic_batches: 16
